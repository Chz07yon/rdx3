<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal | RDX Studios</title>
  <meta name="description" content="RDX Studios Journal — insights on cinematic lighting, digital engineering, and brand strategy from the three creative wings.">
  <meta property="og:title" content="Journal | RDX Studios">
  <meta property="og:description" content="Perspectives on light, code, and visual craft from RDX Studios.">
  <meta property="og:image" content="assets/Hitman RED Wallpaper.webp">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/webp" href="assets/LOGO2.webp">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <style>
    /* Intro */
    .journal-intro {
      padding: 160px 0 var(--space-xl);
      text-align: center;
    }
    .journal-title {
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--rdx-white);
      margin-bottom: var(--space-sm);
    }
    .journal-subtitle {
      color: var(--rdx-gray-light);
      font-size: 1.1rem;
    }

    /* Category Filter Bar */
    .filter-bar {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      flex-wrap: wrap;
      padding: var(--space-lg) 0;
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .filter-btn {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--rdx-gray-light);
      cursor: pointer;
      background: transparent;
      transition: border-color var(--transition-fast), color var(--transition-fast), background var(--transition-fast);
    }
    .filter-btn:hover {
      color: var(--rdx-white);
      border-color: rgba(255,255,255,0.4);
    }
    .filter-btn.is-active {
      background: var(--rdx-red);
      border-color: var(--rdx-red);
      color: var(--rdx-white);
    }

    /* Journal Grid */
    .journal-section {
      padding: var(--space-xl) 0 var(--space-2xl);
    }
    .journal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-xl);
    }
    @media (max-width: 768px) {
      .journal-grid { grid-template-columns: 1fr; }
    }

    .article-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .article-card:hover {
      border-color: rgba(232,0,29,0.5);
      transform: translateY(-4px);
    }
    .article-thumb-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      position: relative;
      background: #111;
    }
    .article-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .article-card:hover .article-thumb {
      transform: scale(1.05);
    }
    .article-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xs);
      font-size: 0.8rem;
    }
    .article-category {
      color: var(--rdx-red-active);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .article-date {
      color: var(--rdx-gray-light);
    }
    .article-body {
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .article-card-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--rdx-white);
      margin-bottom: var(--space-sm);
      line-height: 1.2;
    }
    .article-summary {
      color: var(--rdx-gray-light);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: var(--space-lg);
      flex-grow: 1;
    }
    .article-read-link {
      font-family: var(--font-display);
      color: var(--rdx-white);
      letter-spacing: 0.08em;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color var(--transition-fast);
    }
    .article-card:hover .article-read-link {
      color: var(--rdx-red);
    }
  </style>

  <!-- CONFIRM: Replace example-rdx3.com with live domain -->
  <link rel="canonical" href="https://example-rdx3.com/journal.html">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="rdx-grain">
  
  <div id="page-transition" class="active"></div>
  <div id="nav-placeholder"></div>

  <!-- Intro -->
  <header class="journal-intro">
    <div class="container">
      <h1 class="journal-title rdx-fade-up">Journal</h1>
      <p class="journal-subtitle rdx-fade-up" style="transition-delay:100ms;">
        Perspectives on Light, Code & Visual Craft
      </p>
    </div>
  </header>

  <!-- Filter Bar -->
  <div class="filter-bar" role="group" aria-label="Filter journal by category">
    <button class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
    <button class="filter-btn" data-filter="rdx-red" aria-pressed="false">RDX RED</button>
    <button class="filter-btn" data-filter="code-red" aria-pressed="false">Code RED</button>
    <button class="filter-btn" data-filter="shape-red" aria-pressed="false">Shape RED</button>
  </div>

  <!-- Grid -->
  <section id="main-content" class="journal-section">
    <div class="container">
      <div class="journal-grid" id="journal-grid">
        <!-- Rendered dynamically from data/journal.json -->
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/main.js" defer></script>
  <script>
    let articlesData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('journal-grid');
      const filterBtns = document.querySelectorAll('.filter-btn');

      try {
        const res = await fetch('data/journal.json');
        if (res.ok) {
          articlesData = await res.json();
          renderArticles('all');
        }
      } catch (err) {
        console.error('Error fetching journal data:', err);
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('is-active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('is-active');
          btn.setAttribute('aria-pressed', 'true');
          renderArticles(btn.dataset.filter);
        });
      });

      function renderArticles(filter) {
        grid.innerHTML = '';
        const filtered = filter === 'all'
          ? articlesData
          : articlesData.filter(a => a.categoryId === filter);

        if (filtered.length === 0) {
          grid.innerHTML = '<p style="color: var(--rdx-gray-light); text-align: center; grid-column: 1/-1;">No articles found in this category.</p>';
          return;
        }

        filtered.forEach((article, idx) => {
          const card = document.createElement('article');
          card.className = 'article-card rdx-fade-up';
          card.style.transitionDelay = `${idx * 80}ms`;

          card.innerHTML = `
            <a href="article.html?id=${encodeURIComponent(article.id)}" class="article-thumb-wrap">
              <img src="${article.coverImage}" alt="${article.title}" class="article-thumb" loading="lazy">
            </a>
            <div class="article-body">
              <div class="article-meta-bar">
                <span class="article-category">${article.category}</span>
                <span class="article-date">${article.date} · ${article.readTime}</span>
              </div>
              <h2 class="article-card-title">
                <a href="article.html?id=${encodeURIComponent(article.id)}">${article.title}</a>
              </h2>
              <p class="article-summary">${article.summary}</p>
              <a href="article.html?id=${encodeURIComponent(article.id)}" class="article-read-link">
                Read Article &rarr;
              </a>
            </div>
          `;
          grid.appendChild(card);
        });

        // Trigger observer if available
        if (typeof initAnimations === 'function') {
          initAnimations();
        }
      }
    });
  </script>
</body>
</html>
